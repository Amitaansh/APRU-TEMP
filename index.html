<style>
/*
 * =============================================================================
 * A HOLDING PAGE FOR apruscl2027.com
 * =============================================================================
 * One file, no build step, and no JavaScript at all.
 *
 * Two screens and nothing else. The key visual fills the first, edge to edge;
 * scrolling past it brings up the launch notice and the department's address,
 * and the page ends. There is no header, no lockup and no navigation -- the
 * artwork already carries the conference title, the dates, the APRU roundel and
 * the NUS lockup, so anything laid over it would be saying it twice.
 *
 * THE ARTWORK IS THE CONTENT, and that governs the one real decision here:
 *
 *   Its title is typeset INTO the image, in the upper left, running to about
 *   95% of the image width. So `cover` -- which is what filling the screen
 *   means -- is destructive by nature: every pixel of viewport aspect that
 *   differs from the artwork's own 16:9 is taken off the sides, and the title
 *   is what sits there. At 16:9 nothing is lost; at 16:10 it just reaches the
 *   first and last letters; on a portrait phone it would remove the title
 *   entirely. Landscape therefore covers and accepts the trim, and portrait
 *   falls back to the whole uncropped image -- see THE HERO.
 *
 *   Its text is also pixels, not text. The alt attribute is the only way a
 *   screen reader or a crawler reaches that content, so it carries all of it
 *   verbatim rather than describing the picture.
 */

/*
 * -----------------------------------------------------------------------------
 * FACES
 * -----------------------------------------------------------------------------
 * Atlas Grotesk -- the face the artwork itself is set in, so the page type and
 * the image type are one voice. Subset from the supplied desktop OTFs to the
 * ~120 characters this page can use, which is what takes each file from 649
 * glyphs to under 9 KB.
 *
 * [OPEN] These were supplied as DESKTOP licences. fsType permits embedding, but
 * Commercial Type sells webfont licences separately -- to be confirmed with the
 * client before the domain is pointed here.
 */
@font-face {
  font-family: atlas;
  src: url("fonts/AtlasGrotesk-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: atlas;
  src: url("fonts/AtlasGrotesk-Bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

/*
 * -----------------------------------------------------------------------------
 * THE rem TRICK
 * -----------------------------------------------------------------------------
 * Root font size is set in vw, so 1rem is ~1px at 1920 and every length written
 * in rem below scales with the viewport instead of stepping at breakpoints.
 */
:root {
  font-size: clamp(0.05625rem, 0.0520833333vw, 0.075rem);
}

@media (max-width: 767.98px) {
  :root {
    font-size: clamp(0.05rem, 0.2666666667vw, 0.0725rem);
  }
}

:root {
  --wh: #ffffff;
  --bk: #111111;
  --gr: #6e6e6e;

  /* The artwork's own blue, sampled from the field rather than picked by eye:
   * quantising the image to eight buckets puts a fifth of it within a shade of
   * this. It backs the letterbox on portrait screens, so the bands read as more
   * of the picture instead of as a white frame around it. */
  --art-blue: #4a96c9;

  --font-atlas: atlas;

  color-scheme: light;
}

/* -------------------------------------------------------------------------- */
/* BASE                                                                       */
/* -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: none;
  text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  width: 100%;
  background-color: var(--wh);
  color: var(--bk);
  font-family: var(--font-atlas), ui-sans-serif, system-ui, sans-serif;
  font-size: 18rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.35;
  font-synthesis-weight: none;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--art-blue);
  color: var(--wh);
}

:focus-visible {
  outline: 2px solid var(--art-blue);
  outline-offset: 4rem;
}

/* A 30px page gutter at 1920. The hero deliberately sits outside it. */
.ctr {
  width: 100%;
  padding: 0 30rem;
}

@media (max-width: 767.98px) {
  .ctr {
    padding: 0 20rem;
  }
}

/* -------------------------------------------------------------------------- */
/* THE HERO                                                                   */
/* -------------------------------------------------------------------------- */
/*
 * One full viewport of artwork, flush to all four edges.
 *
 * 100dvh, not 100vh -- on mobile Safari and Chrome 100vh is the height the
 * viewport has with the address bar RETRACTED, so at rest the image would run
 * under the browser chrome and the page would start already scrolled.
 */
.hero {
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  background-color: var(--art-blue);
}

.hero picture,
.hero-img {
  display: block;
  width: 100%;
  height: 100%;
}

.hero-img {
  object-fit: cover;
  object-position: center;
}

/*
 * Portrait and square viewports do NOT crop.
 *
 * Cover takes its trim off whichever axis is over-long, and on a screen taller
 * than it is wide that is the width -- the axis the artwork's title runs along.
 * A phone would lose the title completely, which is most of what the image is
 * for. So below square the whole picture is shown and the leftover height is
 * filled with the artwork's own blue, set on .hero above.
 *
 * Keyed on aspect ratio, not width: the condition is genuinely "is this
 * viewport narrower than it is tall", not "is this a phone". A landscape phone
 * covers like anything else.
 *
 * [BLOCKED] When the client sends the portrait crop of the key visual, add it
 * as the first <source> in the markup below and this fallback can go -- portrait
 * screens would then cover a portrait asset and fill the screen properly too.
 */
@media (max-aspect-ratio: 1/1) {
  .hero-img {
    object-fit: contain;
  }
}

/* -------------------------------------------------------------------------- */
/* THE FOOTER                                                                 */
/* -------------------------------------------------------------------------- */
/*
 * The whole of the second screen, and no taller than it needs to be. The launch
 * notice on the left, where it is read first, and the department's address on
 * the right. Below 768 they stack.
 */
.ftr {
  padding: 56rem 0 44rem;
}

.ftr-in {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  gap: 20rem;
  align-items: start;
}

.ftr-note {
  grid-column: 1 / span 6;
  font-size: 20rem;
  line-height: 1.4;
  max-width: 46ch;
}

.ftr-addr {
  grid-column: 10 / span 6;
  font-style: normal;
  font-size: 15rem;
  line-height: 1.6;
  color: var(--gr);
}

/* The address lines are one block so that the email below them starts on a new
 * line. Without this the anchor is just another inline on the end of the last
 * line, and the whitespace before it in the markup collapses to a single space
 * -- which read as "Singapore 117 566 apru-scl2027@nus.edu.sg". */
.ftr-lines {
  display: block;
}

.ftr-mail {
  margin-top: 16rem;
  color: var(--bk);
}

@media (max-width: 767.98px) {
  .ftr {
    padding: 36rem 0 40rem;
  }
  .ftr-in {
    display: block;
  }
  .ftr-note {
    font-size: 17rem;
    max-width: none;
  }
  .ftr-addr {
    padding-top: 28rem;
    font-size: 14rem;
  }
}

/*
 * -----------------------------------------------------------------------------
 * LINK
 * -----------------------------------------------------------------------------
 * A 1px rule that wipes in from the left and, on leave, retracts to the right.
 * The absurd duration is the point -- it reads as deliberate rather than as a
 * hover state. Carried over unchanged from the previous build.
 */
.link {
  position: relative;
  display: inline-block;
  width: fit-content;
  cursor: pointer;
}

.link::before {
  content: "";
  position: absolute;
  left: 0;
  bottom: -0.08em;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right center;
  transition: transform 1.109s cubic-bezier(0.17, 0.84, 0.44, 1);
  pointer-events: none;
}

.link:hover::before,
.link:focus-visible::before {
  transform: scaleX(1);
  transform-origin: left center;
}

/*
 * -----------------------------------------------------------------------------
 * ENTRANCE
 * -----------------------------------------------------------------------------
 * One keyframe on load, and only on the hero. The footer is below the fold now,
 * so animating it would mean an observer, and an observer means JavaScript --
 * which is the one thing this page does not have. It simply arrives.
 */
@keyframes fade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.fade {
  animation: fade 1.1s cubic-bezier(0.17, 0.84, 0.44, 1) both;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
