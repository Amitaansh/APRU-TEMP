<style>
/*
 * =============================================================================
 * A HOLDING PAGE FOR apruscl2027.com
 * =============================================================================
 * One file, no build step, and no JavaScript at all.
 *
 * The whole page is one screen: a bar carrying the event lockup, the key
 * visual, and the contact block. There is nothing below the fold to reveal on
 * scroll, so the entrance is a plain CSS animation that runs on load -- which
 * is also why the page is fully readable with scripting off. The previous
 * build drove its reveals from an IntersectionObserver and rendered blank
 * without JS; that whole apparatus is gone.
 *
 * THE ARTWORK IS THE CONTENT. The conference title, the dates and the APRU and
 * NUS marks are all typeset INTO the supplied image. Two consequences run
 * through everything below:
 *   1. It can never be cropped -- hence `object-fit: contain` everywhere, and
 *      no full-bleed `cover`. The title runs to ~95% of the image width, so any
 *      crop at all eats into it.
 *   2. Its text is pixels, not text. The alt attribute is the only way a screen
 *      reader or a search engine gets that content, so it carries all of it
 *      verbatim rather than describing the picture.
 */

/*
 * -----------------------------------------------------------------------------
 * FACES
 * -----------------------------------------------------------------------------
 * Atlas Grotesk -- the face the artwork itself is set in, so the page type and
 * the image type are one voice. Subset from the supplied desktop OTFs to the
 * ~120 characters this page can use, which is what takes each file from 649
 * glyphs to under 9 KB.
 *
 * [OPEN] These were supplied as DESKTOP licences. fsType permits embedding, but
 * Commercial Type sells webfont licences separately -- to be confirmed with the
 * client before the domain is pointed here.
 */
@font-face {
  font-family: atlas;
  src: url("fonts/AtlasGrotesk-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: atlas;
  src: url("fonts/AtlasGrotesk-Bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

/*
 * -----------------------------------------------------------------------------
 * THE rem TRICK
 * -----------------------------------------------------------------------------
 * Root font size is set in vw, so 1rem is ~1px at 1920 and every length written
 * in rem below scales with the viewport instead of stepping at breakpoints.
 * Kept from the previous build because a one-screen layout is exactly what it
 * is good for: the bar, the image and the footer all shrink together, so the
 * screen stays full without a stack of media queries.
 */
:root {
  font-size: clamp(0.05625rem, 0.0520833333vw, 0.075rem);
}

@media (max-width: 767.98px) {
  :root {
    font-size: clamp(0.05rem, 0.2666666667vw, 0.0725rem);
  }
}

:root {
  --wh: #ffffff;
  --bk: #111111;
  --gr: #6e6e6e;

  /* Straight off the supplied logo, and the only two colours on the page that
   * are not black, white or grey. */
  --blue: #3e89c8;
  --orange: #f99d2d;

  --font-atlas: atlas;

  /* Slow, no overshoot. Carried over from the previous build. */
  --ease-ref: cubic-bezier(0.17, 0.84, 0.44, 1);

  color-scheme: light;
}

/* -------------------------------------------------------------------------- */
/* BASE                                                                       */
/* -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: none;
  text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/*
 * The one-screen frame. Three rows: the bar and the footer take exactly the
 * height of their content, and the image gets everything left over.
 *
 * 100dvh, not 100vh -- on mobile Safari and Chrome the retracting address bar
 * makes 100vh taller than the visible viewport, which would push the footer off
 * the bottom of the very screen this layout exists to fit.
 *
 * `height`, NOT `min-height`. A min-height leaves the grid's own height
 * indefinite, and against an indefinite height `1fr` resolves to the content's
 * max-content size rather than to the space left over -- so the row took the
 * artwork's full intrinsic height, `height: 100%` inside it fell back to auto,
 * and the footer was pushed clean off the bottom of the screen. A definite
 * height is what makes both the 1fr row and the percentage chain below it
 * resolve against the viewport.
 */
body {
  width: 100%;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background-color: var(--wh);
  color: var(--bk);
  font-family: var(--font-atlas), ui-sans-serif, system-ui, sans-serif;
  font-size: 18rem;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.35;
  font-synthesis-weight: none;
}

/*
 * [BLOCKED -- see the note in the markup] Phones opt out of the one-screen
 * frame entirely and scroll instead. Held to one screen, a 16:9 image sharing
 * a 667px-tall viewport with the bar, the notice and a five-line address ends
 * up about a fifth of the screen high, which makes the artwork's typeset title
 * illegible. This reverts when the portrait crop of the key visual arrives.
 */
@media (max-width: 767.98px) {
  body {
    height: auto;
    min-height: 100dvh;
    display: block;
  }
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--blue);
  color: var(--wh);
}

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 4rem;
}

/*
 * A 30px page gutter at 1920. Everything on the page sits inside it, the
 * artwork included -- so the image never touches the screen edge on a short,
 * wide window, where `contain` would otherwise make it width-limited.
 */
.ctr {
  width: 100%;
  padding: 0 30rem;
}

@media (max-width: 767.98px) {
  .ctr {
    padding: 0 20rem;
  }
}

/* -------------------------------------------------------------------------- */
/* THE BAR                                                                    */
/* -------------------------------------------------------------------------- */
/*
 * Solid, in normal flow, sitting ABOVE the image rather than floating over it.
 * A floating bar was the original intent, but the artwork's own title block
 * starts about 8% down its left side, so anything overlaying the top of the
 * image lands on "Bridging Resilience(s)".
 *
 * The lockup keeps its brand blue and orange, which it can do here because it
 * is on white. Over the artwork -- cerulean and saffron, the same two hues --
 * it would have had to go flat white to stay legible.
 */
.bar {
  padding: 18rem 0;
  background-color: var(--wh);
}

.bar-logo {
  display: block;
  width: auto;
  height: 46rem;
}

@media (max-width: 767.98px) {
  .bar {
    padding: 16rem 0;
  }
  .bar-logo {
    height: 34rem;
  }
}

/* -------------------------------------------------------------------------- */
/* THE STAGE                                                                  */
/* -------------------------------------------------------------------------- */
/*
 * `min-height: 0` is load-bearing. A grid item's default `min-height: auto`
 * refuses to shrink below its content, so without this the 1fr row is floored
 * at the image's intrinsic height and the footer is pushed off-screen on any
 * window shorter than the artwork.
 */
.stage {
  min-height: 0;
  display: block;
}

.stage picture,
.stage-img {
  display: block;
  width: 100%;
  height: 100%;
}

/*
 * contain, never cover. See the note at the top of the file: the title is
 * typeset into the artwork and runs nearly its full width, so cropping is not
 * an option at any viewport. The leftover space is left white.
 */
.stage-img {
  object-fit: contain;
  object-position: center;
}

/* Scrolling, not fitted: the image takes its natural height and the page runs
 * on past it. `height: 100%` here would collapse to nothing, because the block
 * layout above gives it no definite height to resolve against. */
@media (max-width: 767.98px) {
  .stage picture,
  .stage-img {
    height: auto;
  }
}

/*
 * Portrait viewports -- an iPad held upright, most obviously.
 *
 * A 16:9 image can never fill a taller-than-wide screen, so `contain` leaves
 * real space over. Centred in the row, that space splits either side of the
 * artwork and the page reads as a picture marooned between two voids. Letting
 * the image sit up against the bar collects all of it into one band above the
 * footer, which is just an ordinary short page.
 *
 * Keyed on aspect ratio rather than width because that is the actual condition:
 * the artwork is width-limited exactly when the viewport is narrower than it is
 * tall. 3/4 is iPad portrait; anything squarer still fills well enough to centre.
 */
@media (min-width: 768px) and (max-aspect-ratio: 3/4) {
  .stage {
    display: flex;
    align-items: flex-start;
  }
  .stage picture,
  .stage-img {
    height: auto;
  }
}

/* -------------------------------------------------------------------------- */
/* THE FOOTER                                                                 */
/* -------------------------------------------------------------------------- */
/*
 * Two blocks on one row: the launch notice on the left, where it is read first,
 * and the department's address on the right. Below 768 they simply stack.
 */
.ftr {
  padding: 32rem 0 28rem;
}

.ftr-in {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  gap: 20rem;
  align-items: start;
}

.ftr-note {
  grid-column: 1 / span 6;
  font-size: 20rem;
  line-height: 1.4;
  max-width: 46ch;
}

.ftr-addr {
  grid-column: 10 / span 6;
  font-style: normal;
  font-size: 15rem;
  line-height: 1.6;
  color: var(--gr);
}

/* The address lines are one block so that the email below them starts on a new
 * line. Without this the anchor is just another inline on the end of the last
 * line, and the whitespace before it in the markup collapses to a single space
 * -- which read as "Singapore 117 566 apru-scl2027@nus.edu.sg". */
.ftr-lines {
  display: block;
}

.ftr-mail {
  margin-top: 16rem;
  color: var(--bk);
}

@media (max-width: 767.98px) {
  .ftr {
    padding: 28rem 0 32rem;
  }
  .ftr-in {
    display: block;
  }
  .ftr-note {
    font-size: 17rem;
    max-width: none;
  }
  .ftr-addr {
    padding-top: 28rem;
    font-size: 14rem;
  }
}

/*
 * -----------------------------------------------------------------------------
 * LINK
 * -----------------------------------------------------------------------------
 * A 1px rule that wipes in from the left and, on leave, retracts to the right.
 * The absurd duration is the point -- it reads as deliberate rather than as a
 * hover state. Carried over unchanged from the previous build.
 */
.link {
  position: relative;
  display: inline-block;
  width: fit-content;
  cursor: pointer;
}

.link::before {
  content: "";
  position: absolute;
  left: 0;
  bottom: -0.08em;
  width: 100%;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: right center;
  transition: transform 1.109s var(--ease-ref);
  pointer-events: none;
}

.link:hover::before,
.link:focus-visible::before {
  transform: scaleX(1);
  transform-origin: left center;
}

/*
 * -----------------------------------------------------------------------------
 * ENTRANCE
 * -----------------------------------------------------------------------------
 * Everything is above the fold on a one-screen page, so there is nothing to
 * observe and nothing to defer: the whole entrance is one keyframe running on
 * load, staggered by delay. `both` holds the opening state before the delay
 * elapses, so nothing flashes in at full opacity first.
 *
 * No JavaScript is involved, which is what makes the page work with scripting
 * disabled -- the state the previous build could only reach through a script.
 */
@keyframes rise {
  from {
    opacity: 0;
    transform: translate3d(0, 16rem, 0);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.rise {
  animation: rise 0.9s var(--ease-ref) both;
}

.d1 { animation-delay: 0.05s; }
.d2 { animation-delay: 0.14s; }
.d3 { animation-delay: 0.24s; }

/*
 * =============================================================================
 * REDUCED MOTION
 * =============================================================================
 * The entrance resolves instantly and the page is simply a static document.
 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

</footer>
